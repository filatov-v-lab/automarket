<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АвтоМаркет — Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex flex-column content-wrapper">
  <div class="flex-grow-1 d-flex flex-column">

    <nav class="navbar navbar-expand-lg bg-white menu-block position-sticky top-0 z-3 shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">АвтоМаркет</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Магазин</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">О нас</a></li>
            <li class="nav-item"><a class="nav-link" href="help.html">Помощь</a></li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item me-3 position-relative">
              <a class="nav-link cart-lnk" href="cart.html"><i class="bi bi-cart3"></i> Корзина
                <span class="cart-badge" id="cart-badge" style="display:none"></span>
              </a>
            </li>
            <li id="nav-auth"></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="main-content p-3 flex-grow-1 d-flex justify-content-center align-items-center">
      <div class="col-12 col-sm-6 col-md-5 col-xl-4 bg-white rounded-3 p-4 shadow-sm fade-block">
        <h4 class="mb-3 text-center"><i class="bi bi-person-circle me-2"></i>Вход в аккаунт</h4>
        <div id="loginError" class="alert alert-danger d-none">Неверное имя пользователя и/или пароль.</div>
        <div class="mb-3">
          <label for="username" class="form-label">Имя пользователя</label>
          <input id="username" type="text" class="form-control" placeholder="Введите логин" autocomplete="username">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Пароль</label>
          <input id="password" type="password" class="form-control" placeholder="Введите пароль" autocomplete="current-password">
        </div>
        <button class="btn btn-dark w-100 py-2 mb-3" onclick="doLogin()">Войти</button>
        <div class="text-center text-body-secondary small">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></div>
      </div>
    </div>
  </div>

  <footer class="footer-block mt-5 p-3 d-flex justify-content-center text-body-secondary">
    <div class="text-center"><small>© 2026 АвтоМаркет. Все права защищены.</small></div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script>
function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const err = document.getElementById('loginError');
  if (!u || !p) { err.classList.remove('d-none'); return; }
  if (Auth.login(u, p)) {
    location.href = 'index.html';
  } else {
    err.classList.remove('d-none');
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
