{% extends 'main/base.html' %}
{% load static %}
{% load main_tags %}
{% block title %}АвтоМаркет - Авторизация{% endblock %}
{% block content %}
    <div class="flex-grow-1 w-100 d-flex justify-content-center align-items-center">
        <div class="p-3 p-md-5 rounded-3 bg-white col-12 col-sm-7 col-md-5 col-xxl-3">
            <form action="/login-store/" method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <h4>Авторизация</h4>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Имя пользователя</label>
                    <input id="username" name="username" type="text" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input id="password" name="password" type="password" class="form-control" required />
                </div>
                {% if error %}
                	<div class="md-3 alert alert-danger">{{ error }}</div>
                {% endif %}
                <div class="mb-3">
                    <button style="--bs-btn-border-color: #dee2e6;" class="btn btn-outline-dark d-block w-100">Войти</button>
                </div>
                <div class="">
                    <a class="btn btn-link w-100" href="/signup/">Создать учетную запись</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
