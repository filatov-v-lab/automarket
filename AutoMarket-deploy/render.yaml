services:
  - type: web
    name: automarket
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn store.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: automarket-db
          property: connectionString

databases:
  - name: automarket-db
    plan: free
