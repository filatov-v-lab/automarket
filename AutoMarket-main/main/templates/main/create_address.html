<div class="modal fade" id="createAddressModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Введите адрес</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form action="/address/create/" method="POST" id="createAddressForm">
                    {% csrf_token %}
                    <input type="hidden" name="redirect_path" id="redirect_path" value="{{ request.path }}">
                    <div class="mb-3">
                        <label for="city" class="form-label">Город</label>
                        <input id="city" name="city" type="text" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label for="street" class="form-label">Улица</label>
                        <input id="street" name="street" type="text" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label for="house" class="form-label">Дом</label>
                        <input id="house" name="house" type="text" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label for="entrance" class="form-label">Подъезд</label>
                        <input id="entrance" name="entrance" type="text" class="form-control" />
                    </div>
                    <div class="mb-3">
                        <label for="comment" class="form-label">Комментарий</label>
                        <textarea id="comment" name="comment" type="text" class="form-control"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                <button type="submit" class="btn btn-primary" form="createAddressForm">Сохранить</button>
            </div>
        </div>
    </div>
</div>
