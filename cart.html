<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АвтоМаркет — Корзина</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex flex-column content-wrapper">
  <div class="flex-grow-1 d-flex flex-column">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white menu-block position-sticky top-0 z-3 shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">АвтоМаркет</a>
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Магазин</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">О нас</a></li>
            <li class="nav-item"><a class="nav-link" href="help.html">Помощь</a></li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item me-3 position-relative">
              <a class="nav-link cart-lnk active fw-semibold" href="cart.html"><i class="bi bi-cart3"></i> Корзина
                <span class="cart-badge" id="cart-badge" style="display:none"></span>
              </a>
            </li>
            <li id="nav-auth"></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="main-content p-3 px-xl-3 flex-grow-1 d-flex justify-content-center">
      <div class="col-12 col-md-9 col-xl-6 bg-white rounded-3 p-3 fade-block">
        <div class="d-flex align-items-center mb-3">
          <h3 class="m-0 me-3">Корзина</h3>
          <button class="btn btn-link text-decoration-none text-danger p-0" onclick="clearAll()">Очистить</button>
        </div>
        <div id="cart-content"></div>

        <!-- Order form (shown when cart non-empty) -->
        <div id="order-form" class="d-none mt-3">
          <hr>
          <div class="mb-3 text-body-secondary small"><i class="bi bi-info-circle"></i>
            Для оформления заказа <a href="signin.html">войдите</a> или <a href="register.html">зарегистрируйтесь</a>.
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Адрес доставки</label>
            <input type="text" class="form-control" placeholder="г. Город, ул. Улица, д. 1">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Телефон получателя</label>
            <input type="tel" class="form-control" placeholder="+7(999)-999-99-99">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Комментарий к заказу</label>
            <textarea class="form-control" rows="3" placeholder="Дополнительные пожелания…"></textarea>
          </div>
          <button class="btn btn-warning py-3 w-100 fw-semibold fs-5" onclick="placeOrder()">ЗАКАЗАТЬ</button>
        </div>

      </div>
    </div>
  </div>

  <footer class="footer-block mt-5 p-3 d-flex flex-column flex-xl-row justify-content-around text-body-secondary">
    <div class="col-12 col-xl-3"><h5>Поддержка</h5><p>Звоните: <a href="tel:+79999999999" class="text-decoration-none text-black fw-semibold">+7(999)-999-99-99</a></p></div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script>
function renderCart() {
  const items = Cart.get();
  const content = document.getElementById('cart-content');
  const orderForm = document.getElementById('order-form');

  if (items.length === 0) {
    content.innerHTML = `<div class="text-center py-5 text-body-secondary">
      <i class="bi bi-cart-x fs-1"></i><p class="mt-3 fs-5">Корзина пуста</p>
      <a href="index.html" class="btn btn-primary">Перейти в магазин</a>
    </div>`;
    orderForm.classList.add('d-none');
    updateCartBadge();
    return;
  }

  let html = '';
  items.forEach(item => {
    html += `<div class="d-flex border-bottom py-3 align-items-start">
      <img src="${item.img}" alt="${item.name}" class="rounded-3 me-3 object-fit-contain bg-light"
           style="width:90px;height:90px" onerror="this.src='https://placehold.co/90x90/eee/aaa?text=—'">
      <div class="flex-grow-1">
        <a href="product.html?id=${item.pk}" class="text-decoration-none text-dark fw-semibold">${item.name}</a>
        <div class="d-flex align-items-center gap-2 mt-1">
          <span class="text-body-secondary small">Кол-во:</span>
          <input type="number" class="form-control form-control-sm d-inline-block border-0 shadow-none fw-semibold"
                 style="width:4rem" value="${item.qty}" min="1" max="${item.maxQty}"
                 onchange="updateQty(${item.pk}, this.value)">
          <span class="text-body-secondary small">${item.units}</span>
        </div>
        <div class="mt-1">${item.price.toLocaleString('ru-RU')} ₽ × ${item.qty} = <span class="fw-semibold">${(item.price * item.qty).toLocaleString('ru-RU')} ₽</span></div>
        <button class="btn btn-link text-decoration-none text-danger p-0 small" onclick="removeItem(${item.pk})">Удалить</button>
      </div>
    </div>`;
  });
  html += `<div class="text-end fs-5 pt-3">Итого: <span class="fw-semibold">${Cart.total().toLocaleString('ru-RU')} ₽</span></div>`;
  content.innerHTML = html;
  orderForm.classList.remove('d-none');
  updateCartBadge();
}

function removeItem(pk) { Cart.remove(pk); renderCart(); }
function clearAll() { Cart.clear(); renderCart(); }
function updateQty(pk, val) {
  const item = Cart.get().find(i => i.pk === pk);
  const q = Math.max(1, Math.min(item?.maxQty || 99, parseInt(val) || 1));
  Cart.setQty(pk, q);
  renderCart();
}
function placeOrder() {
  alert('Заказ успешно оформлен! (демо-режим)\nВ реальной версии здесь будет отправка на сервер.');
  Cart.clear();
  renderCart();
}

renderCart();
</script>
</body>
</html>
