<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АвтоМаркет — Регистрация</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex flex-column content-wrapper">
  <div class="flex-grow-1 d-flex flex-column">

    <nav class="navbar navbar-expand-lg bg-white menu-block position-sticky top-0 z-3 shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">АвтоМаркет</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Магазин</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">О нас</a></li>
            <li class="nav-item"><a class="nav-link" href="help.html">Помощь</a></li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item me-3 position-relative">
              <a class="nav-link cart-lnk" href="cart.html"><i class="bi bi-cart3"></i> Корзина
                <span class="cart-badge" id="cart-badge" style="display:none"></span>
              </a>
            </li>
            <li id="nav-auth"></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="main-content p-3 flex-grow-1 d-flex justify-content-center align-items-center">
      <div class="col-12 col-sm-7 col-md-5 col-xl-4 bg-white rounded-3 p-4 shadow-sm fade-block">
        <h4 class="mb-3 text-center"><i class="bi bi-person-plus me-2"></i>Регистрация</h4>
        <div id="regError" class="alert alert-danger d-none"></div>
        <div class="mb-3">
          <label class="form-label">Имя пользователя</label>
          <input id="regUsername" type="text" class="form-control" placeholder="Логин" autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input id="regEmail" type="email" class="form-control" placeholder="email@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Имя</label>
          <input id="regFirst" type="text" class="form-control" placeholder="Ваше имя">
        </div>
        <div class="mb-3">
          <label class="form-label">Фамилия</label>
          <input id="regLast" type="text" class="form-control" placeholder="Ваша фамилия">
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input id="regPass" type="password" class="form-control" autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label class="form-label">Повторите пароль</label>
          <input id="regPass2" type="password" class="form-control" autocomplete="new-password">
        </div>
        <button class="btn btn-dark w-100 py-2 mb-3" onclick="doRegister()">Зарегистрироваться</button>
        <div class="text-center text-body-secondary small">Уже есть аккаунт? <a href="signin.html">Войти</a></div>
      </div>
    </div>
  </div>

  <footer class="footer-block mt-5 p-3 d-flex justify-content-center text-body-secondary">
    <div class="text-center"><small>© 2026 АвтоМаркет. Все права защищены.</small></div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script>
async function doRegister() {
  const username  = document.getElementById('regUsername').value.trim();
  const email     = document.getElementById('regEmail').value.trim();
  const firstName = document.getElementById('regFirst').value.trim();
  const lastName  = document.getElementById('regLast').value.trim();
  const password  = document.getElementById('regPass').value;
  const password2 = document.getElementById('regPass2').value;
  const err = document.getElementById('regError');

  if (!username || !email || !password || !password2) {
    err.textContent = 'Пожалуйста, заполните все обязательные поля.';
    err.classList.remove('d-none'); return;
  }
  if (password !== password2) {
    err.textContent = 'Пароли не совпадают.';
    err.classList.remove('d-none'); return;
  }
  if (password.length < 6) {
    err.textContent = 'Пароль должен содержать не менее 6 символов.';
    err.classList.remove('d-none'); return;
  }
  const result = await Auth.register({ username, email, firstName, lastName, password });
  if (result) {
    err.textContent = result;
    err.classList.remove('d-none'); return;
  }
  location.href = 'index.html';
}
</script>
</body>
</html>
