<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АвтоМаркет — Помощь</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex flex-column content-wrapper">
  <div class="flex-grow-1 d-flex flex-column">

    <nav class="navbar navbar-expand-lg bg-white menu-block position-sticky top-0 z-3 shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">АвтоМаркет</a>
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Магазин</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">О нас</a></li>
            <li class="nav-item"><a class="nav-link active fw-semibold" href="help.html">Помощь</a></li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item me-3 position-relative">
              <a class="nav-link cart-lnk" href="cart.html"><i class="bi bi-cart3"></i> Корзина
                <span class="cart-badge" id="cart-badge" style="display:none"></span>
              </a>
            </li>
            <li id="nav-auth"></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="main-content p-3 px-xl-3 flex-grow-1 d-flex justify-content-center align-items-center">
      <div class="col-12 col-sm-7 col-xxl-5 bg-white rounded-3 p-4 shadow-sm fade-block">

        <div id="successMsg" class="d-none alert alert-success">
          <i class="bi bi-check-circle-fill me-2"></i>Ваше обращение отправлено! Мы свяжемся с вами в ближайшее время.
        </div>

        <div id="formBlock">
          <h4 class="mb-3"><i class="bi bi-headset me-2"></i>Форма обращения</h4>
          <div class="mb-3">
            <label for="fname" class="form-label">Ваше имя</label>
            <input id="fname" type="text" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="femail" class="form-label">Email</label>
            <input id="femail" type="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="fphone" class="form-label">Телефон</label>
            <input id="fphone" type="tel" class="form-control" placeholder="+7(999)-999-99-99" required>
          </div>
          <div class="mb-3">
            <label for="fcomment" class="form-label">Опишите Ваш вопрос</label>
            <textarea id="fcomment" class="form-control" rows="5" required></textarea>
          </div>
          <div id="formError" class="text-danger small mb-2 d-none">Пожалуйста, заполните все поля.</div>
          <button class="btn btn-outline-dark w-100 py-2" onclick="sendForm()">Отправить</button>
        </div>

      </div>
    </div>
  </div>

  <footer class="footer-block mt-5 p-3 d-flex flex-column flex-xl-row justify-content-around text-body-secondary">
    <div class="col-12 col-xl-3"><h5>Поддержка</h5><p>Звоните: <a href="tel:+79999999999" class="text-decoration-none text-black fw-semibold">+7(999)-999-99-99</a></p></div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script>
function sendForm() {
  const name = document.getElementById('fname').value.trim();
  const email = document.getElementById('femail').value.trim();
  const phone = document.getElementById('fphone').value.trim();
  const comment = document.getElementById('fcomment').value.trim();
  const err = document.getElementById('formError');

  if (!name || !email || !phone || !comment) {
    err.classList.remove('d-none');
    return;
  }
  err.classList.add('d-none');
  document.getElementById('formBlock').classList.add('d-none');
  document.getElementById('successMsg').classList.remove('d-none');
}
</script>
</body>
</html>
